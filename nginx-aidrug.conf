# AI for Science 大陆情报系统 — aidrug.kesixu.com (HTTP-only initial deploy)
limit_req_zone $binary_remote_addr zone=aidrug_api:10m rate=10r/s;

upstream aidrug_backend {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aidrug.kesixu.com;

    # Basic auth
    auth_basic "AI for Science 大陆情报系统";
    auth_basic_user_file /etc/nginx/.htpasswd_aidrug;

    # Security headers (no HSTS until SSL is set up)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS|HEAD)$) { return 405; }

    # 对话 SSE。basic auth 在 server 级，这里仍然要登录。
    # proxy_buffering off 才能边生成边下发；不能沿用下面 location 的 Connection upgrade。
    location /api/v1/chat/stream {
        proxy_pass http://aidrug_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
    }

    location / {
        proxy_pass http://aidrug_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
